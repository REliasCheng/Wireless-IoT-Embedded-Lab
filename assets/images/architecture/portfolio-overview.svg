<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Embedded connectivity stack</title><desc id="desc">The main device path uses native Wi-Fi, lwIP and TCP, MQTT, and IoT integration; Classic Bluetooth SPP is parallel and BLE remains reference-only.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker><style>.bg{fill:#0d1117}.grid{stroke:#30363d;opacity:.28}.box{stroke-width:2}.input{fill:#21262d;stroke:#8b949e}.core{fill:#0d419d;stroke:#58a6ff}.hardware{fill:#1f6f3d;stroke:#3fb950}.output{fill:#f0f6fc;stroke:#c9d1d9}.reference{fill:#161b22;stroke:#8b949e;stroke-dasharray:8 6}.title{font:700 28px system-ui,sans-serif;fill:#f0f6fc}.sub{font:16px system-ui,sans-serif;fill:#8b949e}.label{font:700 16px system-ui,sans-serif;fill:#f0f6fc;text-anchor:middle}.detail{font:13px system-ui,sans-serif;fill:#c9d1d9;text-anchor:middle}.dark{fill:#0d1117}.arrow{fill:none;stroke:#8b949e;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}</style></defs>
  <rect class="bg" width="1200" height="470" rx="22"/><path class="grid" d="M0 105H1200M0 370H1200M300 0V470M600 0V470M900 0V470"/>
  <text class="title" x="50" y="52">Embedded Connectivity Stack</text><text class="sub" x="50" y="82">Main Wi-Fi / MQTT path with parallel Bluetooth boundaries</text>
  <rect class="box input" x="35" y="135" width="190" height="84" rx="14"/><text class="label" x="130" y="169">Device Application</text><text class="detail" x="130" y="196">payload · state</text>
  <rect class="box hardware" x="270" y="135" width="170" height="84" rx="14"/><text class="label" x="355" y="169">Native Wi-Fi</text><text class="detail" x="355" y="196">STA · DHCP</text>
  <rect class="box core" x="485" y="135" width="170" height="84" rx="14"/><text class="label" x="570" y="169">lwIP / TCP</text><text class="detail" x="570" y="196">socket path</text>
  <rect class="box core" x="700" y="135" width="170" height="84" rx="14"/><text class="label" x="785" y="169">MQTT</text><text class="detail" x="785" y="196">plain TCP 1883</text>
  <rect class="box output" x="915" y="135" width="245" height="84" rx="14"/><text class="label dark" x="1037" y="169">IoT Integration</text><text class="detail dark" x="1037" y="196">interface path</text>
  <rect class="box hardware" x="270" y="300" width="260" height="84" rx="14"/><text class="label" x="400" y="334">Classic Bluetooth SPP</text><text class="detail" x="400" y="361">parallel device channel</text>
  <rect class="box reference" x="640" y="300" width="230" height="84" rx="14"/><text class="label" x="755" y="334">BLE GATT</text><text class="detail" x="755" y="361">Reference only</text>
  <path class="arrow" d="M225 177H270M440 177H485M655 177H700M870 177H915M130 219V265H400V300"/>
  <path class="arrow dash" d="M130 219V250H755V300"/>
</svg>
