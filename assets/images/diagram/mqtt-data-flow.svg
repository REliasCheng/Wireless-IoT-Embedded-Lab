<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">MQTT Application Data Flow</title>
  <desc id="desc">Synthetic application variables are encoded as JSON, passed to the MCU-side MQTT client, transported over TCP port 1883 and native Wi-Fi, and addressed to Aliyun IoT.</desc>
  <rect width="1040" height="360" rx="20" fill="#f6f8fa"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="520" y="42" font-size="26" font-weight="700" fill="#1f2328">MQTT Application Data Flow</text>
    <g fill="#ffffff" stroke="#57606a" stroke-width="2">
      <rect x="30" y="100" width="170" height="94" rx="12"/>
      <rect x="232" y="100" width="150" height="94" rx="12"/>
      <rect x="414" y="100" width="170" height="94" rx="12"/>
      <rect x="616" y="100" width="160" height="94" rx="12"/>
      <rect x="808" y="100" width="200" height="94" rx="12"/>
    </g>
    <g fill="#1f2328">
      <text x="115" y="137" font-size="17" font-weight="700">Application Variables</text>
      <text x="115" y="164" font-size="14">Synthetic values</text>
      <text x="307" y="137" font-size="17" font-weight="700">JSON Payload</text>
      <text x="307" y="164" font-size="14">Property fields</text>
      <text x="499" y="137" font-size="17" font-weight="700">MQTT Client</text>
      <text x="499" y="164" font-size="14">Publish / Subscribe</text>
      <text x="696" y="137" font-size="17" font-weight="700">TCP :1883</text>
      <text x="696" y="164" font-size="14">Plain transport</text>
      <text x="908" y="137" font-size="17" font-weight="700">Native Wi-Fi</text>
      <text x="908" y="164" font-size="14">Aliyun IoT destination</text>
    </g>
    <g stroke="#0969da" stroke-width="3" fill="none">
      <path d="M200 147 H232"/><path d="M382 147 H414"/><path d="M584 147 H616"/><path d="M776 147 H808"/>
    </g>
    <g fill="#0969da">
      <path d="M224 141 L234 147 L224 153 Z"/><path d="M406 141 L416 147 L406 153 Z"/><path d="M608 141 L618 147 L608 153 Z"/><path d="M800 141 L810 147 L800 153 Z"/>
    </g>
    <rect x="196" y="242" width="648" height="62" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="520" y="269" font-size="16" font-weight="700" fill="#633c01">Evidence boundary</text>
    <text x="520" y="291" font-size="14" fill="#633c01">No sensor sampling, TLS session, cloud-online log, or runtime measurement is claimed.</text>
  </g>
</svg>
